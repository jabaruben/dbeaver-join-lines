name: Bug report
description: Report a problem with installation, DBeaver integration, or Join Lines behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough information to reproduce it.

  - type: input
    id: dbeaver-version
    attributes:
      label: DBeaver version
      placeholder: e.g. 26.1.5 Community
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Problem area
      options:
        - Installation
        - Uninstallation
        - Join Lines menu item is missing
        - Join Lines command does not work
        - Build/release tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Right click...
        3. Select...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste relevant output or drag screenshots here. Please remove sensitive information.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested with the latest available plugin release.
          required: true
        - label: I checked existing issues for duplicates.
          required: true
